[project]
name = "arcvault"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = ["Django==6.1.3", "celery[redis]", "psycopg[binary]", "openai", "pydantic", "gunicorn", "whitenoise", "django-htmx", "dj-database-url"]
[dependency-groups]
dev = ["pytest", "pytest-django", "ruff"]
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["."]
[tool.ruff]
target-version = "py314"
