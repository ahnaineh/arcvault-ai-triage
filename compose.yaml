x-app: &app
  build: .
  env_file: .env
  environment:
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    POSTGRES_HOST: db
    REDIS_URL: redis://redis:6379/0
services:
  db:
    image: postgres:18.3
    environment:
      POSTGRES_USER: arcvault
      POSTGRES_DB: arcvault
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: [postgres:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arcvault"]
      interval: 3s
      retries: 20
  redis:
    image: redis:8.6.1
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20
  migrate:
    <<: *app
    command: python manage.py migrate --noinput
    depends_on:
      db: {condition: service_healthy}
  web:
    <<: *app
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  recovery:
    <<: *app
    restart: unless-stopped
    command: python manage.py recover_requests --loop
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  worker:
    <<: *app
    command: celery -A config.celery:app worker --loglevel=INFO
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
volumes:
  postgres:
