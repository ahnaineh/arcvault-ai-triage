{% extends 'base.html' %}{% load static %}{% block content %}<h1>Test a request</h1><p>Try a support message, then follow its routing and supporting evidence. Processing uses the configured provider.</p><form id="tester">{% csrf_token %}<label for="source">Source</label><select id="source"><option>Email</option><option>Web Form</option><option>Support Portal</option></select><label for="message">Original message</label><textarea id="message" required maxlength="20000" rows="10"></textarea><button id="submit">Send request</button><button type="button" id="resume" hidden>Resume</button><button type="button" id="new" hidden>Start a new submission</button></form><p id="progress" role="status" aria-live="polite">Ready to send.</p><a id="detail" hidden>Open request</a><script src="{% static 'intake/tester.js' %}" defer></script>{% endblock %}
